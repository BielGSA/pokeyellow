name: Sync final Pokemon Yellow source

on:
  push:
    paths:
      - 'Pokemon-Yellow-Complete-FINAL.zip'
      - '.github/workflows/sync-final-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract final package
        run: |
          rm -rf /tmp/pokeyellow-final
          mkdir -p /tmp/pokeyellow-final
          unzip -q Pokemon-Yellow-Complete-FINAL.zip -d /tmp/pokeyellow-final
          SRC=$(find /tmp/pokeyellow-final -mindepth 1 -maxdepth 1 -type d | head -n 1)
          cp -a "$SRC"/. .

      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Sync Pokemon Yellow Complete final source"
            git push
          fi
